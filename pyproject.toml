[project]
authors = [{name = "bkj", email = "bkj.322@gmail.com"}]
dependencies = []
name = "feature_spreading"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
fs = "feature_spreading.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
feature_spreading = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.5.4,<3"
pandas = ">=3.1.1,<4"
scikit-learn = ">=1.9.1,<2"
pytorch = ">=2.14.1,<3"
transformers = ">=5.22.2,<6"
datasets = ">=5.1.0,<6"
pillow = ">=13.0.0,<14"
rich = ">=15.0.0,<16"
